# Dokcer Compose 설정 파일
# 인프라(DB,Kafka,Zookeeper)을 복잡한 설치 과정없이 한번에 실행하기 위한 컨테이너 배치도

services:
  # 1. 데이터베이스 (MySQL)
  db:
    image: mysql:8.0                  # 도커 허브에서 공식 MySQL 8.0 버전을 가져옵니다.
    container_name: security-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 1234       # Spring 설정과 동일하게 맞추세요
      MYSQL_DATABASE: security_db     # application.yml에서 설정한 security_db라는 데이터베이스를 서버 실행 시 자동으로 생성
    volumes:
      - ./mysql_data:/var/lib/mysql   # 매우 중요. 컨테이너는 삭제되면 데이터도 사라지는데, ./mysql_data 폴더와 컨테이너 내부를 연결해두오 컴퓨터를 껐다 켜도 데이터가 유지되도록함.

  # 2. Kafka의 관리자 (Zookeeper)
  # 카프카 브로커의 상태를 점검, 어떤 노드가 리더인지 결정하는 등 분산 환경의 메타데이터를 관리. ( 카프카 실행을 위해 필수)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # 3. 메시지 큐 (Kafka)
  # 실시간 로그 데이터를 수집하고 전달하는 핵심 통로
  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    depends_on:
      - zookeeper   # 주키퍼가 먼저 실행된 후 카프카가 실행된다는 순서 정의
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092  # 컨테이너는 kafka:29092, 호스트의 Spring Boot 앱은 localhost:9092 사용.
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1               # 테스트 환경이라 복제본을 1개만 두겠다는 뜻 (실제 운영환경은 보통 3이상을 사용함.)

networks:
  default:
    name: security-net
