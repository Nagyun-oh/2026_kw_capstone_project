# Local 프로필에서 공통 설정에 덮어 적용
spring:
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/security_db?serverTimezone=Asia/Seoul}"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  # 로컬에서는 실행 SQL을 확인할 수 있도록 활성화
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  management:
    # 로컬 성능 점검에 필요한 endpoint 노출
    endpoints:
      web:
        exposure:
          include:
            - health
            - info
            - metrics
            - prometheus

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}