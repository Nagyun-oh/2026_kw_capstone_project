# 모든 환경에서 공유하는 설정
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    # 테이블을 자동 생성,수정하지 않고 Entity와의 일치 여부만 검사
    hibernate:
      ddl-auto: validate

    # 기본적으로 SQL 출력 비활성화
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    # SQL 파일을 이용해 DB 스키마 변경 이력 관리
    enabled: true
    locations: classpath:db/migration

    # 기존 DB의 기준점 등록은 최초 전환 시 명시적으로 수행
    baseline-on-migrate: false

    # Flyway clean 명령을 통한 스키마 삭제 방지
    clean-disabled: true

  kafka:
    consumer:
      group-id: log-group

      # 유효한 커밋 offset이 없을 때 처음부터 읽도록 설정
      auto-offset-reset: earliest

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  # 프로젝트에서 정의한 JWT 설정
  # spring 하위가 아닌 최상위에 배치
security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}


management:
  # 기본적으로 상태 확인 endpoint만 HTTP로 노출
  endpoints:
    web:
      exposure:
        include:
          - health

  endpoint:
    health:
      show-details: never

  # 성능 지표 설정
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,1s

server:
  port: ${SERVER_PORT:8080}