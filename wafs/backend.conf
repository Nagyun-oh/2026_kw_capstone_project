# 실험실 더미 백엔드: 어떤 메서드·경로든 200을 돌려준다(If-Match 등 조건부 헤더가 있으면 nginx가 412·304를 줄 수 있다).
# 실험실 WAF는 요청 단계에서만 차단하므로 차단 여부는 백엔드와 무관하다.
# JuiceShop은 대량 공격 요청에 메모리가 늘어 종료돼(약 64초 만에 힙 4GB 초과) 측정에 쓰지 않는다.
server {
    listen 8080;
    client_max_body_size 1m;

    location / {
        return 200 "ok\n";
    }
}
