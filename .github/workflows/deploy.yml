name: Deploy to EC2

# 앱 이미지(backend/frontend/ai)를 빌드해 ECR에 push하고, SSM으로 EC2에서 교체한다.
# 첫 배포는 수동 실행으로 검증한다. 검증 후 CI 성공 시 자동 배포하도록 트리거를 추가한다.
# 설정 절차: docs/07_cicd_pipeline.md
on:
  workflow_dispatch:
    inputs:
      sha:
        description: '배포할 커밋 SHA(40자). 비우면 현재 develop을 빌드해 배포. 롤백 시 이전 배포 SHA 입력(빌드 생략)'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write # OIDC로 AWS 임시 자격 증명 발급

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
  REPO_DIR_ON_EC2: /home/ubuntu/2026_kw_capstone_project

jobs:
  prepare:
    name: Resolve target
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      build: ${{ steps.target.outputs.build }}
    steps:
      - name: Check branch and variables
        run: |
          # IAM trust policy도 develop만 허용하지만, 실패 원인을 명확히 하기 위해 먼저 확인한다.
          if [ "$GITHUB_REF" != "refs/heads/develop" ]; then
            echo "::error::develop 브랜치에서만 배포할 수 있습니다. (현재: $GITHUB_REF)"; exit 1
          fi
          for v in AWS_REGION AWS_ROLE_ARN ECR_REGISTRY EC2_INSTANCE_ID; do
            if [ -z "${!v}" ]; then echo "::error::Repository variable $v 가 없습니다. (docs/07 5장)"; exit 1; fi
          done
      - name: Resolve target SHA
        id: target
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          if [ -z "$INPUT_SHA" ]; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "sha=$INPUT_SHA" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::sha는 40자리 소문자 16진수여야 합니다."; exit 1
          fi

  build:
    name: Build & push (${{ matrix.service }})
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: backend
            context: backend
          - service: frontend
            context: frontend
          - service: ai
            context: AI_new
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Cache model files
        if: matrix.service == 'ai'
        uses: actions/cache@v4
        with:
          path: |
            AI_new/models/model_bundle_tree_schema.pkl
            AI_new/models/transformer/model_bundle.pkl
          key: ai-models-${{ hashFiles('AI_new/models.lock.json') }}
      - name: Fetch and verify model files
        if: matrix.service == 'ai'
        run: python3 scripts/fetch_models.py
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ env.ECR_REGISTRY }}/security-${{ matrix.service }}:${{ needs.prepare.outputs.sha }}
          # 단일 이미지 manifest로 push해 ECR 목록·수명 주기 정책을 단순하게 유지한다.
          provenance: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  deploy:
    name: Deploy on EC2
    needs: [prepare, build]
    # 롤백(빌드 생략) 시에도 실행되도록 build가 skipped인 경우를 허용한다.
    if: always() && needs.prepare.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Send deploy command via SSM
        id: send
        run: |
          # SSM은 root로 실행된다. 저장소는 ubuntu 소유이므로 git은 ubuntu 계정으로 실행한다.
          # EC2에 커밋되지 않은 수정이 있으면 덮어쓰지 않고 중단한다.
          PARAMS=$(jq -n \
            --arg dir "$REPO_DIR_ON_EC2" --arg sha "$SHA" \
            --arg reg "$ECR_REGISTRY" --arg region "$AWS_REGION" '{
            commands: [
              "set -eu",
              "cd \($dir)",
              "sudo -u ubuntu -H git diff --quiet HEAD || { echo \"EC2 저장소에 커밋되지 않은 수정이 있습니다. git status 확인 후 다시 실행하세요.\"; sudo -u ubuntu -H git status --short; exit 1; }",
              "sudo -u ubuntu -H git fetch --quiet origin develop",
              "sudo -u ubuntu -H git checkout --quiet --detach \($sha)",
              "ECR_REGISTRY=\($reg) AWS_REGION=\($region) bash scripts/deploy.sh \($sha)"
            ],
            executionTimeout: ["900"]
          }')
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${SHA:0:12}" \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command: $CMD_ID"
      - name: Wait for result
        env:
          CMD_ID: ${{ steps.send.outputs.command_id }}
        run: |
          STATUS=Pending
          for _ in $(seq 1 180); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$EC2_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          echo "::group::EC2 output"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query StandardOutputContent --output text || true
          echo "::endgroup::"
          echo "::group::EC2 stderr"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query StandardErrorContent --output text || true
          echo "::endgroup::"
          {
            echo "### EC2 deploy"
            echo "- commit: \`${SHA}\`"
            echo "- status: **${STATUS}**"
            echo "- rollback: 이전 배포 SHA를 입력해 이 workflow를 다시 실행"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$STATUS" = "Success" ] || { echo "::error::배포 실패 (status: $STATUS)"; exit 1; }
