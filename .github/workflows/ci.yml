name: Project CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Initial CI checks builds and configuration only.
# Functional tests, model evaluation and deployment are not included yet.
jobs:
  backend:
    name: Backend build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle
            backend/gradle/wrapper/gradle-wrapper.properties
      - name: Build executable JAR (no tests)
        working-directory: backend
        run: bash ./gradlew --no-daemon bootJar

  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Build production assets
        working-directory: frontend
        run: npm run build

  ai:
    name: AI syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # AI_new/Dockerfile의 python:3.12 이미지와 버전을 맞춘다.
          python-version: '3.12'
      - name: Compile Python sources without executing or training
        run: python -m compileall -q AI_new

  compose:
    name: Compose configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose files without starting services
        run: |
          docker compose -f backend/docker-compose.yml config --quiet
          docker compose -f waf/docker-compose.yml config --quiet
          docker compose -f waf/docker-compose.yml -f targets/juiceshop/docker-compose.yml config --quiet
