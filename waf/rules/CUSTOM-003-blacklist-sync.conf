# =============================================================
# CUSTOM-003: 백엔드 블랙리스트 자동 동기화 (rule id 20100)
#
# waf/sync/blacklist-sync.sh가 백엔드 GET /internal/waf/blacklist 목록으로
# 아래 파일을 만들고, nginx -t를 통과할 때만 교체·reload한다.
#
# ModSecurity v3는 IncludeOptional을 지원하지 않아 Include 대상이 없으면 WAF가 시작되지 않는다.
# 그래서 waf-blacklist-init 컨테이너가 WAF보다 먼저 빈 룰 파일을 만들어 둔다.
#
# 수동 차단은 CUSTOM-002-blacklist.conf(id 20001~20099)에 추가한다.
# =============================================================
Include /var/lib/waf-blacklist/blacklist.conf
