# =============================================================
# CUSTOM-002: IP 블랙리스트 (수동 관리)
#
# 백엔드 블랙리스트는 CUSTOM-003-blacklist-sync.conf로 자동 동기화된다(id 20100).
# 이 파일에는 백엔드와 별개로 직접 차단할 IP만 추가한다.
#
# 추가 방법:
#   SecRule REMOTE_ADDR "@ipMatch 1.2.3.4" \
#       "id:20001,phase:1,deny,status:403,log,msg:'Blacklisted IP'"
#
# 주의: id는 20001부터 순서대로 증가시켜 사용(20100은 자동 동기화용)
# MODSEC_RULE_ENGINE=DetectionOnly에서는 deny가 실행되지 않으므로,
# 실제로 차단하려면 CUSTOM-003처럼 ctl:ruleEngine=On을 함께 넣는다.
# =============================================================

# 예시 (실제 차단할 IP로 교체)
# SecRule REMOTE_ADDR "@ipMatch 192.168.1.100" \
#     "id:20001,\
#     phase:1,\
#     deny,\
#     status:403,\
#     log,\
#     msg:'Blacklisted IP - Auto blocked by backend',\
#     tag:'custom/blacklist'"
