# =============================================================
# CUSTOM-001: AI 모델 임계값 기반 커스텀 룰
#
# SQLi, XSS, Path Traversal은 CRS(PARANOIA=2)가 이미 처리.
# 여기서는 AI 모델(LightGBM)이 학습한 CSIC 데이터셋 기준으로
# CRS에 없는 수치형 임계값만 추가 정의.
#
#   url_len  → 500자 초과 차단
#   body_len → 10KB 초과 차단
#   method   → GET/POST 외 차단 (API 서버 특성상)
# =============================================================

# -----------------------------------------------
# 1. 허용하지 않는 HTTP 메서드 차단
#    Spring Boot API 서버는 GET/POST만 사용
# -----------------------------------------------
SecRule REQUEST_METHOD "!@within GET POST PUT PATCH DELETE HEAD OPTIONS" \
    "id:10001,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'Disallowed HTTP Method',\
    logdata:'Method: %{REQUEST_METHOD}',\
    tag:'custom/method'"

# -----------------------------------------------
# 2. 비정상적으로 긴 URL 차단
#    AI 모델 url_len 특성 기준: CSIC 데이터셋 공격 URL 분포 반영
# -----------------------------------------------
SecRule REQUEST_URI_RAW "@gt 500" \
    "id:10002,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'Abnormal URL Length Detected',\
    logdata:'URI length: %{MATCHED_VAR}',\
    tag:'custom/url-length'"

# -----------------------------------------------
# 3. 비정상적으로 큰 요청 바디 차단
#    AI 모델 body_len 특성 기준: 10KB 초과
# -----------------------------------------------
SecRule REQUEST_BODY_LENGTH "@gt 10240" \
    "id:10003,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'Abnormal Request Body Size',\
    logdata:'Body length: %{MATCHED_VAR}',\
    tag:'custom/body-size'"

# -----------------------------------------------
# 4. Juice Shop REST method compatibility
# -----------------------------------------------
SecAction \
    "id:10004,\
    phase:1,\
    pass,\
    nolog,\
    setvar:'tx.allowed_methods=GET HEAD POST PUT PATCH DELETE OPTIONS'"

# -----------------------------------------------
# 5. Juice Shop Socket.IO polling compatibility
#    Socket.IO uses text/plain for polling requests. CRS 920420
#    blocks that content type at anomaly threshold 5, causing retries.
# -----------------------------------------------
SecRule REQUEST_URI "@beginsWith /socket.io/" \
    "id:10005,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=920420"
