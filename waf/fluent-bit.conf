[SERVICE]
    Flush        0.5
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf
    # 읽기 위치와 전송 대기 데이터를 Compose named volume에 보관
    storage.path /var/lib/fluent-bit/storage
    storage.sync full
    storage.checksum On

[INPUT]
    Name              tail
    Path              /var/log/nginx/access.log
    Tag               waf.access
    Parser            json
    DB                /var/lib/fluent-bit/access.db
    DB.sync           Full
    storage.type      filesystem
    # 최초 적용/상태 DB 유실 시 기존 로그도 읽는다. 중복 저장 방지는 백엔드와 협의한다.
    Read_from_Head    True
    Rotate_Wait       60
    Refresh_Interval  1
    # 기본 버퍼(32KB)를 넘는 줄이 오면 파일 감시 전체가 멈춘다. 상한을 늘리고,
    # 상한을 넘는 줄은 그 줄만 건너뛴다. Kafka 기본 메시지 상한(약 1MB)보다 작게 둔다.
    Buffer_Chunk_Size 64k
    Buffer_Max_Size   512k
    Skip_Long_Lines   On

[INPUT]
    Name              tail
    Path              /var/log/nginx/waf-audit.log
    Tag               waf.audit
    Parser            json
    DB                /var/lib/fluent-bit/audit.db
    DB.sync           Full
    storage.type      filesystem
    Read_from_Head    True
    Rotate_Wait       60
    Refresh_Interval  1
    # 감사 로그 한 줄에는 요청 본문(최대 128KB)과 응답 본문(최대 1MB)이 JSON 이스케이프되어 들어간다.
    # Lua 필터가 탐지 필드만 남기므로 Kafka로 나가는 레코드는 작다.
    Buffer_Chunk_Size 256k
    Buffer_Max_Size   8m
    Skip_Long_Lines   On

[FILTER]
    Name    lua
    Match   waf.audit
    script  /fluent-bit/etc/waf-detection.lua
    call    extract_detection

[OUTPUT]
    Name        kafka
    Match       waf.access
    Brokers     kafka:29092
    Topics      log-topic
    Format      json
    # 재시도 소진/메시지 시간 만료를 피한다. Kafka ACK와 DB 저장 완료는 별개다.
    # librdkafka 메모리 큐까지 디스크에 보존되는 것은 아니므로 원본을 삭제하지 않는다.
    Retry_Limit False
    queue_full_retries 0
    rdkafka.request.required.acks -1
    rdkafka.message.timeout.ms 0

[OUTPUT]
    Name        kafka
    Match       waf.audit
    Brokers     kafka:29092
    Topics      waf-detection-topic
    Format      json
    Retry_Limit False
    queue_full_retries 0
    rdkafka.request.required.acks -1
    rdkafka.message.timeout.ms 0
