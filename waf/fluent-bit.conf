[SERVICE]
    Flush        0.5
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf
    # 읽기 위치와 전송 대기 데이터를 Compose named volume에 보관
    storage.path /var/lib/fluent-bit/storage
    storage.sync full
    storage.checksum On

[INPUT]
    Name              tail
    Path              /var/log/nginx/access.log
    Tag               waf.access
    Parser            json
    DB                /var/lib/fluent-bit/access.db
    DB.sync           Full
    storage.type      filesystem
    # 최초 적용/상태 DB 유실 시 기존 로그도 읽는다. 중복 저장 방지는 백엔드와 협의한다.
    Read_from_Head    True
    Rotate_Wait       60
    Refresh_Interval  1

[INPUT]
    Name              tail
    Path              /var/log/nginx/error.log
    Tag               waf.error
    Parser            nginx_error
    DB                /var/lib/fluent-bit/error.db
    DB.sync           Full
    storage.type      filesystem
    Read_from_Head    True
    Rotate_Wait       60
    Refresh_Interval  1

[OUTPUT]
    Name        kafka
    Match       waf.access
    Brokers     kafka:29092
    Topics      log-topic
    Format      json
    # 재시도 소진/메시지 시간 만료를 피한다. Kafka ACK와 DB 저장 완료는 별개다.
    # librdkafka 메모리 큐까지 디스크에 보존되는 것은 아니므로 원본을 삭제하지 않는다.
    Retry_Limit False
    queue_full_retries 0
    rdkafka.request.required.acks -1
    rdkafka.message.timeout.ms 0

[OUTPUT]
    Name        kafka
    Match       waf.error
    Brokers     kafka:29092
    Topics      waf-error-topic
    Format      json
    Retry_Limit False
    queue_full_retries 0
    rdkafka.request.required.acks -1
    rdkafka.message.timeout.ms 0
